    .reveal code { color: var(--inftec-yellow); background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; }
    .reveal ul, .reveal ol { text-align: left; }

    .reveal .slide-logo {
      position: fixed;
      top: 20px;
      left: 30px;
      height: 84px;
      opacity: 0.85;
      z-index: 10;
    }

    .reveal .slide-clock {
      position: fixed;
      top: 25px;
      right: 30px;
      font-size: 1.1rem;
      color: var(--inftec-light);
      opacity: 0.6;
      z-index: 10;
      font-variant-numeric: tabular-nums;
    }

    .reveal a { color: var(--inftec-orange); }
    .reveal a:hover { color: var(--inftec-yellow); }
    .reveal .slide-number { color: var(--inftec-light); }
    .reveal .progress { color: var(--inftec-orange); }
    .reveal .controls { color: var(--inftec-orange); }

    /* iframe slides need full height */
    .reveal .slides section .iframe-slide {
      height: 700px;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    .iframe-slide h3 {
      margin: 0;
      padding: 10px 0;
      text-align: center;
      flex-shrink: 0;
    }
    .iframe-slide iframe {
      flex: 1;
      width: 100%;
      border: none;
      border-radius: 8px;
    }

    /* Click shield to capture clicks and refocus for keyboard nav */
    .iframe-focus-shield {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      z-index: 5;
      cursor: default;
    }

## Demo: Doodle Challenge

Can AI recognize your doodles?
        </textarea></section>

        <section data-markdown><textarea data-template>
### How it works

- **CNN** (Convolutional Neural Network) — a type of AI that learns to recognize visual patterns by scanning images through layers of filters
- Trained on Google's **Quick, Draw!** dataset — 25 categories, 200k samples
- ~90% accuracy, 28x28 pixel input, &lt;1 MB model
- **ONNX** (Open Neural Network Exchange) — universal model format that runs on any platform
- Model runs *in your browser* via ONNX Runtime WebAssembly — no server needed
        </textarea></section>

        <section data-markdown><textarea data-template>
### No cloud needed

The model runs **entirely on your device**

- No API calls, no latency, no data leaving your phone
- Classification every 300ms as you draw
- Server only handles the leaderboard
        </textarea></section>

        <section data-markdown><textarea data-template>
### Watch AI Draw: Adversarial Examples

- AI optimizes pixels to maximize a target category
- Result: 95%+ confidence — but looks like noise to humans
- This is why adversarial attacks on AI are a real problem

*Self-driving cars, content filters, biometric systems...*

### Teach it something new

Transfer learning with KNN on the feature space

- Draw 3–5 samples of a new category
- Uses the CNN's 128-dim features + cosine similarity
- No retraining needed — works instantly
- Shared across all participants via WebSocket
        </textarea></section>

        <section data-markdown><textarea data-template>
### Key Takeaways

- AI models can be **tiny** (&lt;1 MB) and run locally
- Training data quality matters more than quantity
- Transfer learning: reuse features for new tasks
- AI confidence ≠ human perception (adversarial examples)
- AI is a **tool** — powerful but needs human judgement

  <script src="https://unpkg.com/reveal.js@4/dist/reveal.js"></script>
  <script src="https://unpkg.com/reveal.js@4/plugin/markdown/markdown.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      transition: 'slide',
      backgroundTransition: 'fade',
      plugins: [RevealMarkdown],
      slideNumber: true,
      progress: true,
      width: 1280,
      height: 720
    });

    // Clock
    const clockEl = document.getElementById('clock');
    function updateClock() {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 10000);

    // Focus shields: clicking the top bar of iframe slides refocuses reveal for keyboard nav
    document.querySelectorAll('.iframe-focus-shield').forEach(shield => {
      shield.addEventListener('click', () => {
        document.querySelector('.reveal').focus();
      });
    });

    // Also: pressing Escape in an iframe should refocus reveal
    window.addEventListener('message', (e) => {
      if (e.data === 'focus-parent') document.querySelector('.reveal').focus();
    });

    // Global key handler: if arrow keys are pressed while iframe has focus, navigate
    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Escape'].includes(e.key)) {
        // Check if an iframe has focus
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
          document.querySelector('.reveal').focus();
          // Re-dispatch the key event to reveal
          if (e.key === 'ArrowRight') Reveal.next();
          else if (e.key === 'ArrowLeft') Reveal.prev();
          else if (e.key === 'ArrowDown') Reveal.down();
          else if (e.key === 'ArrowUp') Reveal.up();
          else if (e.key === 'Escape') Reveal.toggleOverview();
        }
      }
    });
  </script>
