<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Doodle Challenge</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container join-screen">
    <h1>Doodle Challenge</h1>
    <p class="subtitle">Draw fast. Get recognized. Win!</p>
    <form id="join-form">
      <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" autocomplete="off" required>
      <button type="submit">Join Game</button>
    </form>
    <div style="margin-top:20px;display:flex;flex-direction:column;gap:10px">
      <a href="/freedraw.html" style="color:#888;text-decoration:none">Free Drawing</a>
      <a href="/train.html" style="color:#888;text-decoration:none">Train Custom Categories</a>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    document.getElementById('join-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('player-name').value.trim();
      if (!name) return;
      sessionStorage.setItem('playerName', name);
      socket.emit('join', name);
    });
    socket.on('game-config', (config) => {
      sessionStorage.setItem('gameConfig', JSON.stringify(config));
      window.location.href = '/game.html';
    });
  </script>
</body>
</html>
