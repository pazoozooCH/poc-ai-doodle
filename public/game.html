<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Doodle Challenge - Play</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .lobby-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 20px;
    }
    .lobby-view h2 { color: #e94560; margin-bottom: 10px; }
    .lobby-mode { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
    .lobby-players-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 15px 0; }
    .lobby-waiting { color: #888; font-size: 1.1rem; margin-top: 20px; }
    .lobby-waiting .spinner-inline {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid #333; border-top-color: #e94560;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }

    /* Tic-Tac-Toe */
    .ttt-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      max-width: 220px;
      margin: 0 auto;
      padding: 10px;
    }
    .ttt-cell {
      aspect-ratio: 1;
      background: #16213e;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 0.65rem;
      font-weight: 600;
      color: #ccc;
      border: 2px solid #333;
      transition: border-color 0.3s, background 0.3s, transform 0.2s;
      position: relative;
      overflow: hidden;
    }
    .ttt-cell.claimed {
      transform: scale(0.95);
    }
    .ttt-cell .ttt-cell-label {
      z-index: 1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .ttt-cell .ttt-cell-owner {
      font-size: 0.55rem;
      z-index: 1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .ttt-cell img {
      width: 50%;
      height: 50%;
      object-fit: contain;
      filter: invert(1);
      opacity: 0.6;
    }
    .ttt-cell.claimed img { opacity: 0.3; }
    .ttt-winner-banner {
      text-align: center;
      padding: 15px;
      font-size: 1.3rem;
      font-weight: 700;
      animation: pop 0.3s ease-out;
    }
    .ttt-your-color {
      display: inline-block;
      width: 16px; height: 16px;
      border-radius: 50%;
      vertical-align: middle;
      margin-right: 6px;
      border: 2px solid #fff;
    }
    .ttt-cell.winning-cell {
      animation: winPulse 0.6s ease-in-out infinite alternate;
    }
    @keyframes winPulse {
      from { transform: scale(0.95); }
      to { transform: scale(1.05); }
    }

    .si-invader-list { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 10px; }
    .si-invader-tag { padding: 6px 14px; border-radius: 20px; background: rgba(233,69,96,0.2); border: 1px solid rgba(233,69,96,0.4); font-size: 0.85rem; color: #eee; }
    .si-feedback { text-align: center; padding: 10px; font-size: 1.1rem; font-weight: 600; min-height: 2em; }
    .si-feedback.hit { color: #2ecc71; }
    .si-feedback.miss { color: #e94560; }

    /* Hit/miss flash */
    .flash-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 199;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .flash-overlay.flash-hit { background: rgba(46, 204, 113, 0.3); opacity: 1; }
    .flash-overlay.flash-miss { background: rgba(233, 69, 96, 0.3); opacity: 1; }
  </style>
</head>
<body>
  <div id="loading" class="model-loading">
    <div class="spinner"></div>
    <p>Loading AI model...</p>
  </div>

  <!-- Lobby -->
  <div id="lobby" style="display:none">
    <div class="lobby-view">
      <h2>Doodle Challenge</h2>
      <div class="lobby-mode">Mode: <strong id="lobby-mode">Quick Draw</strong></div>
      <div id="lobby-count" style="color:#888">0 players</div>
      <div class="lobby-players-grid" id="lobby-players"></div>
      <div class="lobby-waiting"><span class="spinner-inline"></span>Waiting for host to start...</div>
    </div>
  </div>

  <!-- Quick Draw mode -->
  <div id="game" style="display:none">
    <div class="game-header">
      <div class="score-display">
        <span id="score">Score: 0</span>
        <span id="streak"></span>
      </div>
      <span id="round-info">1 / 10</span>
    </div>

    <div class="prompt-area">
      <div>Draw a</div>
      <div class="prompt-word" id="prompt-word">cat</div>
      <div class="timer" id="timer">20.0</div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="canvas" width="280" height="280"></canvas>
    </div>

    <div class="predictions" id="predictions"></div>

    <div class="game-controls">
      <button class="btn-clear" id="btn-clear">Clear</button>
      <img id="debug-preview" width="56" height="56" style="border:1px solid #333;border-radius:4px;image-rendering:pixelated;display:none" title="What the model sees">
    </div>
  </div>

  <!-- Space Invaders mode -->
  <div id="si-game" style="display:none">
    <div class="game-header">
      <div class="score-display">
        <span id="si-score">Score: 0</span>
        <span id="si-streak"></span>
      </div>
      <span>Space Invaders</span>
    </div>

    <div id="si-feedback" class="si-feedback"></div>

    <div style="padding:10px;text-align:center;color:#888;font-size:0.9rem">Draw what you see on screen!</div>

    <div class="canvas-wrapper">
      <canvas id="si-canvas" width="280" height="280"></canvas>
    </div>

    <div class="predictions" id="si-predictions"></div>

    <div class="game-controls">
      <button id="si-shoot" style="padding:10px 30px;border:none;border-radius:12px;background:#2ecc71;color:#000;font-weight:600;cursor:pointer;font-size:1.1rem">Shoot!</button>
      <button class="btn-clear" id="si-clear">Clear</button>
    </div>

    <div id="si-waiting" style="text-align:center;padding:20px;color:#888;display:none">
      Waiting for host...
    </div>
  </div>

  <!-- Tic-Tac-Toe mode -->
  <div id="ttt-game" style="display:none">
    <div class="game-header">
      <div class="score-display">
        <span id="ttt-score">Score: 0</span>
        <span id="ttt-streak"></span>
      </div>
      <span>Tic-Tac-Toe <span class="ttt-your-color" id="ttt-my-color"></span></span>
    </div>

    <div id="ttt-winner-banner" class="ttt-winner-banner" style="display:none"></div>

    <div id="ttt-feedback" class="si-feedback"></div>

    <div class="canvas-wrapper">
      <canvas id="ttt-canvas" width="280" height="280"></canvas>
    </div>

    <div class="predictions" id="ttt-predictions"></div>

    <div class="game-controls">
      <button id="ttt-claim" style="padding:10px 30px;border:none;border-radius:12px;background:#e94560;color:#fff;font-weight:600;cursor:pointer;font-size:1.1rem">Claim!</button>
      <button class="btn-clear" id="ttt-clear">Clear</button>
    </div>

    <div class="ttt-board" id="ttt-board"></div>
  </div>

  <div id="game-over" class="game-over" style="display:none">
    <h1>Game Over!</h1>
    <div class="final-score" id="final-score">0</div>
    <p>points</p>
    <button onclick="window.location.href='/'">Play Again</button>
  </div>

  <div id="round-overlay" class="round-result-overlay" style="display:none">
    <div class="result-content" id="round-result-text"></div>
  </div>

  <div class="flash-overlay" id="flash-overlay"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script type="module" src="/js/game.js"></script>
</body>
</html>
