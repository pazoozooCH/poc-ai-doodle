<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Doodle Challenge - Free Drawing</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="loading" class="model-loading">
    <div class="spinner"></div>
    <p>Loading AI model...</p>
  </div>

  <div id="app" style="display:none">
    <div class="game-header">
      <a href="/" style="color:#888;text-decoration:none">Back</a>
      <span>Free Drawing</span>
    </div>

    <div class="prompt-area">
      <div class="prompt-word" id="top-prediction">Draw something!</div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="canvas" width="280" height="280"></canvas>
    </div>

    <div class="predictions" id="predictions"></div>

    <div class="game-controls">
      <button class="btn-clear" id="btn-clear">Clear</button>
      <img id="debug-preview" width="56" height="56" style="border:1px solid #333;border-radius:4px;image-rendering:pixelated;display:none" title="What the model sees">
    </div>

    <div style="padding:20px;text-align:center;border-top:1px solid #222;margin-top:15px">
      <div style="margin-bottom:10px;color:#888">AI Features</div>
      <div style="display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap">
        <select id="category-select" style="padding:10px 15px;border-radius:12px;background:#16213e;color:#eee;border:2px solid #333;font-size:1rem"></select>
        <button id="btn-examples" class="btn-clear">Show Examples</button>
        <button id="btn-ai-draw" style="padding:10px 25px;border:none;border-radius:12px;background:#e94560;color:white;font-weight:600;cursor:pointer">Watch AI Draw</button>
      </div>
      <div id="examples-grid" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px"></div>
      <div id="ai-gallery" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:15px"></div>
      <div id="ai-status" style="color:#888;margin-top:10px"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script src="/js/freedraw.js"></script>
</body>
</html>
