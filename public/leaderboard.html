<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doodle Challenge - Leaderboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .mode-switcher {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .mode-btn {
      padding: 8px 20px;
      border: 2px solid #333;
      border-radius: 20px;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .mode-btn.active {
      border-color: #e94560;
      color: #eee;
      background: rgba(233, 69, 96, 0.2);
    }
    .mode-btn:hover { border-color: #e94560; }

    /* Space Invaders display */
    #si-container { position: relative; }
    #si-canvas {
      display: block;
      margin: 0 auto;
      background: #0a0a1a;
      border-radius: 8px;
    }
    .si-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin: 15px 0;
      flex-wrap: wrap;
    }
    .si-controls button {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .si-controls .btn-start { background: #2ecc71; color: #000; }
    .si-controls .btn-stop { background: #e94560; color: #fff; }
    .si-controls label { color: #888; font-size: 0.85rem; }
    .si-controls select, .si-controls input {
      padding: 6px 10px;
      border-radius: 6px;
      background: #16213e;
      color: #eee;
      border: 1px solid #333;
    }

    .si-sidebar {
      display: flex;
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .si-game-area { flex: 3; }
    .si-leaderboard-area { flex: 1; min-width: 200px; }
    .si-leaderboard-area h3 { color: #888; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

    .si-hit-feed {
      margin-top: 15px;
      max-height: 150px;
      overflow-y: auto;
    }
    .si-hit-feed div {
      padding: 4px 0;
      font-size: 0.8rem;
      color: #2ecc71;
      border-bottom: 1px solid #1a1a2e;
    }


    /* QR Code overlay */
    .qr-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      padding: 8px 16px;
      border: 2px solid #333;
      border-radius: 20px;
      background: rgba(22, 33, 62, 0.9);
      color: #888;
      cursor: pointer;
      font-size: 0.85rem;
      transition: border-color 0.2s;
    }
    .qr-toggle:hover { border-color: #e94560; color: #eee; }
    .qr-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99;
      cursor: pointer;
    }
    .qr-overlay .qr-url {
      color: #eee;
      font-size: 1.5rem;
      margin-top: 20px;
      font-family: monospace;
    }
    .qr-overlay .qr-hint {
      color: #888;
      font-size: 0.9rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="leaderboard-screen">
    <a href="/" style="position:fixed;top:20px;left:20px;color:#888;text-decoration:none;font-size:0.9rem;z-index:100">&larr; Home</a>
    <h1>Doodle Challenge</h1>

    <div class="mode-switcher">
      <button class="mode-btn active" data-mode="quick-draw">Quick Draw</button>
      <button class="mode-btn" data-mode="space-invaders">Space Invaders</button>
    </div>

    <!-- Game controls -->
    <div style="text-align:center;margin-bottom:20px">
      <button id="btn-start-game" class="btn-start" style="padding:12px 40px;border:none;border-radius:12px;background:#2ecc71;color:#000;font-size:1.1rem;font-weight:600;cursor:pointer">Start Game</button>
      <button id="btn-stop-game" class="btn-stop" style="display:none;padding:12px 40px;border:none;border-radius:12px;background:#e94560;color:#fff;font-size:1.1rem;font-weight:600;cursor:pointer">Stop Game</button>
    </div>

    <!-- Lobby -->
    <div id="lobby-container">
      <div style="text-align:center;margin-bottom:10px">
        <span id="lobby-count" style="color:#888">0 players joined</span>
      </div>
      <div id="lobby-players" style="text-align:center">
        <p class="no-players">Waiting for players to join...</p>
      </div>
    </div>

    <!-- Quick Draw leaderboard (shown during play) -->
    <div id="qd-container" style="display:none">
      <div id="leaderboard-content">
        <p class="no-players">No scores yet</p>
      </div>
    </div>

    <!-- Space Invaders (shown during play) -->
    <div id="si-container" style="display:none">
      <div class="si-controls">
        <label>Difficulty:
          <select id="si-difficulty">
            <option value="0.3">Easy (30%)</option>
            <option value="0.5" selected>Medium (50%)</option>
            <option value="0.7">Hard (70%)</option>
            <option value="0.85">Expert (85%)</option>
          </select>
        </label>
        <label>Speed:
          <select id="si-speed">
            <option value="slow">Slow</option>
            <option value="medium" selected>Medium</option>
            <option value="fast">Fast</option>
          </select>
        </label>
      </div>

      <div class="si-sidebar">
        <div class="si-game-area">
          <canvas id="si-canvas" width="800" height="600"></canvas>
        </div>
        <div class="si-leaderboard-area">
          <h3>Scores</h3>
          <div id="si-scores"></div>
          <h3 style="margin-top:20px">Hit Feed</h3>
          <div class="si-hit-feed" id="si-feed"></div>
        </div>
      </div>
    </div>
  </div>

  <button class="qr-toggle" id="qr-toggle">QR Code</button>
  <div class="qr-overlay" id="qr-overlay" style="display:none">
    <div id="qr-code"></div>
    <div class="qr-url" id="qr-url"></div>
    <div class="qr-hint">Scan to join &middot; click anywhere to close</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="/js/leaderboard.js"></script>
  <script type="module">
    import { initFooter } from '/js/shared/footer.js';
    initFooter();
  </script>
  <script>
    (async () => {
      const resp = await fetch('/api/info');
      const info = await resp.json();
      const url = info.url;

      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      document.getElementById('qr-code').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 4 });
      document.getElementById('qr-code').querySelector('svg').style.borderRadius = '8px';
      document.getElementById('qr-url').textContent = url;

      const overlay = document.getElementById('qr-overlay');
      document.getElementById('qr-toggle').addEventListener('click', () => {
        overlay.style.display = overlay.style.display === 'none' ? 'flex' : 'none';
      });
      overlay.addEventListener('click', () => { overlay.style.display = 'none'; });
    })();
  </script>
</body>
</html>
